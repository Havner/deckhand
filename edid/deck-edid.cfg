# Load the multi-refresh EDID for the internal panel from the very first read.
# amdgpu then caches it for the whole boot, so it also survives suspend/resume.
# The file is looked up in firmware_class.path; if it is missing or invalid the
# kernel logs an error and falls back to the panel's real EDID.
#
# Install (as root):
#   mkdir -p /etc/deck-edid /etc/default/grub.d
#   cp deck-oled-sdc-multi.bin /etc/deck-edid/
#   cp deck-edid.cfg /etc/default/grub.d/
#   update-grub
# Uninstall: rm /etc/default/grub.d/deck-edid.cfg && update-grub
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} drm.edid_firmware=eDP-1:deck-oled-sdc-multi.bin firmware_class.path=/etc/deck-edid"
