[package]
name = "deckhandd"
description = "The deckhand daemon: runs the headless engine, seeded from the CLI, and serves a control socket for clients."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The headless runtime. default-features off so this binary chooses the controller backend
# (mirrors the engine's own forwarding); on Linux the backend features are inert (uinput).
engine = { path = "../engine", default-features = false }
ipc = { path = "../ipc" }
config = { path = "../config" }
ron.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
# `termination` also traps SIGTERM/SIGHUP → clean `systemctl stop` (PLAN §4.4).
ctrlc = { workspace = true, features = ["termination"] }

# `--prevent-sleep`: hold a freedesktop ScreenSaver idle-inhibitor on the session D-Bus while
# forwarding (the compositor sees no local input, so it would blank/suspend). Unprivileged,
# DE-provided, headless (a bus call — no X/Wayland). Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# `--systemd`: adopt the socket-activation fd (`LISTEN_FDS`) and signal readiness (`sd-notify
# READY=1`) for a `Type=notify` user unit. Linux only (the Windows-service path is separate).
sd-notify.workspace = true

[features]
default = ["vigem"]
vigem = ["engine/vigem"]
viiper = ["engine/viiper"]
