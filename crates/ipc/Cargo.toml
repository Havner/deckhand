[package]
name = "ipc"
description = "Control-plane wire protocol + local-socket client/server for the deckhand daemon (deckhandd) and its clients (deckhandctl, the daemon-mode UI). Depends on config, never engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
postcard.workspace = true
interprocess.workspace = true
# Messages carry the on-disk config model (client ships ConfigDoc, daemon compiles - PLAN 4.4).
config = { path = "../config" }
