[package]
name = "deckhandctl"
description = "Thin CLI client for the deckhand daemon (deckhandd): one-shot control commands over the local socket."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ipc = { path = "../ipc" }
# Read RON profiles/globals to ship as ConfigDoc/GlobalConfig (client ships config, daemon compiles).
config = { path = "../config" }
ron.workspace = true
clap.workspace = true
