[package]
name = "ui-test-qt"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[[bin]]
name = "deckhand-ui-qt"
path = "src/main.rs"

[dependencies]
ui-test-common = { path = "../ui-test-common" }
ipc = { path = "../ipc" }
config = { path = "../config" }
cxx = "1"
cxx-qt = "0.9"
cxx-qt-lib = { version = "0.9", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.9"
