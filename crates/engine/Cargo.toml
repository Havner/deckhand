[package]
name = "engine"
description = "Deckhand headless runtime/manager: compiles config to a Program, runs the mapping loop over steam-hid input, emits via virt-out. See PLAN §4."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The mapping model we compile into the runtime Program (PLAN §4.1, decision A: the IR
# and compile() live HERE, not in config — config stays pure authoring data).
config = { path = "../config" }
# Shared output vocabulary (Key / MouseButton / GamepadButton / GamepadAxis).
vocab = { path = "../vocab" }
# Input HAL (devices, ControllerState) and output HAL (Sink, OutputEvent, Rumble). The
# engine owns and drives both directly (PLAN §4). virt-out's controller (virtual-gamepad)
# backend is compile-time selectable and off by default; forward the choice via the engine's
# own `vigem` feature below. A plain engine build is controller-less (kb/mouse only).
steam-hid = { path = "../steam-hid" }
virt-out = { path = "../virt-out", default-features = false }
# Sync concurrency: `select!` in the central loop over frame/control/tick channels.
crossbeam-channel.workspace = true
log.workspace = true
thiserror.workspace = true

[features]
# Forward virt-out's controller-backend selection. `vigem` is the engine default (the proven
# backend), so a plain `cargo run -p engine` gets the ViGEm pad. Build `--no-default-features` for a
# controller-less (kb/mouse-only) engine, or `--no-default-features --features viiper` for the
# experimental VIIPER backend. The two backends are mutually exclusive (virt-out enforces this with
# a compile error), so bare `--features viiper` would clash with the default `vigem` — drop the
# default. (virt-out itself keeps NO default feature; only the engine, as the app, picks one.)
default = ["vigem"]
vigem = ["virt-out/vigem"]
# Alternative controller backend: VIIPER (USB/IP), experimental. See virt-out `win/viiper.rs`.
viiper = ["virt-out/viiper"]

# Dev-deps for the `deckhand-run` example (PLAN §4.2 S10): load a profile from RON, log,
# and shut down cleanly on Ctrl-C. `ctrlc`'s `termination` feature also traps SIGTERM/SIGHUP
# so a future daemon gets clean `systemctl stop`.
[dev-dependencies]
ron.workspace = true
env_logger.workspace = true
ctrlc = { workspace = true, features = ["termination"] }
clap.workspace = true
