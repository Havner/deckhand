[package]
name = "engine"
description = "Deckhand headless runtime/manager: compiles config to a Program, runs the mapping loop over steam-hid input, emits via virt-out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# The authoring model. compile() lives HERE (PLAN 4.1, decision A) and turns a ConfigDoc into a
# `mapper::Program`; config stays pure authoring data.
config = { path = "../config" }
# The pure mapping core: the Mapper, the Program IR it evaluates, and the LogicalFrame it reads.
# The engine compiles config into a `mapper::Program` and drives the Mapper over real devices +
# the network. The mapper itself depends only on the vocab crates, never on this engine or a HAL.
mapper = { path = "../mapper" }
# Input HAL (devices, ControllerState) and output HAL (Sink, OutputEvent, Rumble). The
# engine owns and drives both directly (PLAN 4). virt-out's controller (virtual-gamepad)
# backend is compile-time selectable and off by default; forward the choice via the engine's
# own `vigem` feature below. A plain engine build is controller-less (kb/mouse only). steam-hid
# serde is on so ControllerState/Report cross the 6 wire.
steam-hid = { path = "../steam-hid", features = ["serde"] }
virt-out = { path = "../virt-out", default-features = false }
# Sync concurrency: `select!` in the central loop over frame/control/tick channels.
crossbeam-channel.workspace = true
log.workspace = true
thiserror.workspace = true
# (De)serialization of the Program IR + wire messages for the 6 network transport. Always
# compiled - the network role is a *runtime* choice (set_input/set_output), not a cargo feature.
serde.workspace = true
# Compact serde-native codec for the 6 network wire (datagrams + length-prefixed TCP frames).
postcard.workspace = true

[features]
# Forward virt-out's controller-backend selection. `vigem` is the engine default (the proven
# backend), so a plain `cargo run -p engine` gets the ViGEm pad. Build `--no-default-features` for a
# controller-less (kb/mouse-only) engine, or `--no-default-features --features viiper` for the
# experimental VIIPER backend. The two backends are mutually exclusive (virt-out enforces this with
# a compile error), so bare `--features viiper` would clash with the default `vigem` - drop the
# default. (virt-out itself keeps NO default feature; only the engine, as the app, picks one.)
default = ["vigem"]
vigem = ["virt-out/vigem"]
# Alternative controller backend: VIIPER (USB/IP), experimental. See virt-out `win/viiper.rs`.
viiper = ["virt-out/viiper"]

# RON parsing for the profile-compile test (the runnable harness now lives in the `deckhandd`
# binary crate; PLAN 4.4).
[dev-dependencies]
ron.workspace = true
