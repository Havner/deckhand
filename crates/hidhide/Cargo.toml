[package]
name = "hidhide"
description = "Run a command with matching HID devices hidden from it (Linux user+mount namespace; the HidHide analog)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "deckhand-hidhide"
path = "src/main.rs"

# Linux-only: needs unprivileged user + mount namespaces. Elsewhere the binary builds
# (a stub main) with no dependencies at all.
[target.'cfg(target_os = "linux")'.dependencies]
clap.workspace = true
libc.workspace = true
